<title>HeavyDuty Garage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: steel header band + tabbed workspace; dashboard = status strip, kanban board, crew rail. Job detail opens as a side sheet. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#e3e7ec; --ink:#1a1f26; --muted:#5a6471; --line:#d2d8df;
  --steel:#26303b; --steel-ink:#e9edf1; --steel-muted:#9eabb8;
  --accent:#e3a008; --accent-ink:#1a1f26; --accent-soft:#fbefcc;
  --crit:#c4342b; --warn:#b86e00; --ok:#2c7d3f; --info:#2d68a6;
  --c-emg:#c4342b; --c-diag:#2d68a6; --c-pm:#2c7d3f; --c-minor:#1b8a8a; --c-major:#5146a8;
  --c-hyd:#d06a12; --c-fab:#8a5a2b; --c-paint:#b0357c; --c-warr:#6b7480;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b; --surface:#1b2128; --surface-2:#232a33; --ink:#e6eaee; --muted:#98a3af; --line:#313943;
  --steel:#0c1014; --steel-ink:#e6eaee; --steel-muted:#8995a2;
  --accent:#f2b630; --accent-ink:#161a1f; --accent-soft:#3a3018;
  --crit:#ff6a5c; --warn:#f0a338; --ok:#5cc274; --info:#6aa7ee;
  --c-emg:#ff6a5c; --c-diag:#6aa7ee; --c-pm:#5cc274; --c-minor:#4cc3c3; --c-major:#9a90f0;
  --c-hyd:#f39443; --c-fab:#c99760; --c-paint:#ec6fb7; --c-warr:#9aa3ad;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1b2128; --surface-2:#232a33; --ink:#e6eaee; --muted:#98a3af; --line:#313943;
  --steel:#0c1014; --steel-ink:#e6eaee; --steel-muted:#8995a2;
  --accent:#f2b630; --accent-ink:#161a1f; --accent-soft:#3a3018;
  --crit:#ff6a5c; --warn:#f0a338; --ok:#5cc274; --info:#6aa7ee;
  --c-emg:#ff6a5c; --c-diag:#6aa7ee; --c-pm:#5cc274; --c-minor:#4cc3c3; --c-major:#9a90f0;
  --c-hyd:#f39443; --c-fab:#c99760; --c-paint:#ec6fb7; --c-warr:#9aa3ad;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* header */
header.top{background:var(--steel);color:var(--steel-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--steel) 6px 12px);border:2px solid var(--accent)}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.brand small{display:block;font-size:.72rem;color:var(--steel-muted);letter-spacing:.06em;text-transform:uppercase}
.role{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--steel-muted)}
.role select{background:transparent;border:1px solid var(--steel-muted);border-radius:4px;padding:4px 8px;color:var(--steel-ink)}
.role select option{color:#1a1f26;background:#fff}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--steel-muted);padding:8px 14px 9px;font-family:var(--f-display);font-size:1.05rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--steel-ink)}
nav.tabs button[aria-current="page"]{color:var(--steel-ink);border-bottom-color:var(--accent)}
.sample-note{font-size:.78rem;color:var(--muted);padding-block:8px}

main{padding-block:8px 48px}
section.view{display:flex;flex-direction:column;gap:18px}
.view-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.view-head h2{margin-right:auto}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{padding:4px 9px;font-size:.82rem}
input[type=search],input[type=text],input[type=date],input[type=number],select.field,textarea{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi.alert b{color:var(--crit)}
.kpi.warn b{color:var(--warn)}
.kpi span{font-size:.8rem;color:var(--muted)}

/* dashboard layout */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1000px){.dash{grid-template-columns:minmax(0,1fr)}}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(215px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.col-head h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.05em}
.col-head .num{color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px 9px 13px;cursor:pointer;position:relative;text-align:left;width:100%;display:flex;flex-direction:column;gap:5px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:5px 0 0 5px;background:var(--cat)}
.card:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .mono{font-size:.78rem;color:var(--muted)}
.card .mach{font-weight:600;line-height:1.25}
.card .cust{font-size:.8rem;color:var(--muted)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.78rem}
.empty-col{font-size:.8rem;color:var(--muted);padding:6px 4px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:3px;border:1px solid currentColor;color:var(--cat,var(--muted));white-space:nowrap;letter-spacing:.02em}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pri{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px}
.pri.Critical{background:var(--crit);color:var(--surface)}
.pri.High{color:var(--warn);border:1px solid var(--warn)}
.pri.Normal{color:var(--muted);border:1px solid var(--line)}
.pri.Low{color:var(--muted)}
.due.over{color:var(--crit);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-weight:700;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);flex:none}
.avatar.lg{width:56px;height:56px;font-size:1.1rem}
.avatars{display:flex}
.avatars .avatar{width:22px;height:22px;font-size:.6rem;margin-left:-5px;border:2px solid var(--surface)}
.avatars .avatar:first-child{margin-left:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.panel-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-body{padding:6px 0}
.rail{display:flex;flex-direction:column;gap:14px}
.crew{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer}
.crew:hover{background:var(--surface-2)}
.crew-info{flex:1;min-width:0}
.crew-info b{display:block;font-weight:600;font-size:.88rem}
.crew-info small{color:var(--muted);font-size:.76rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap}
.state.on{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.state.field{background:color-mix(in srgb,var(--c-hyd) 16%,transparent);color:var(--c-hyd)}
.state.idle{background:var(--surface-2);color:var(--muted)}
.state.leave{color:var(--muted);border:1px dashed var(--line)}
.attn{display:flex;gap:10px;padding:8px 14px;cursor:pointer;align-items:flex-start;font-size:.85rem}
.attn:hover{background:var(--surface-2)}
.attn i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--sev)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.stock-low{color:var(--warn);font-weight:600}
.stock-out{color:var(--crit);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{display:flex;gap:6px;align-items:center;font-size:.85rem}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cal .dow{background:var(--surface-2);padding:6px 8px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cal .day{background:var(--surface);min-height:108px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--surface-2);opacity:.6}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dnum{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.cal .day.today .dnum{color:var(--ink);font-weight:600}
.ev{font-size:.72rem;padding:2px 5px;border-radius:3px;border-left:3px solid var(--cat);background:color-mix(in srgb,var(--cat) 12%,var(--surface));cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.ev.pm{background:transparent;border:1px dashed var(--cat);border-left:3px solid var(--cat)}
.ev.over{outline:1px solid var(--crit)}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:.78rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--cat)}
@media (max-width:700px){.cal .day{min-height:64px}.cal .ev{font-size:0;height:6px;padding:0}.cal .dow{font-size:.6rem;padding:4px}}
.agenda{display:none}
@media (max-width:700px){.agenda{display:block}}

/* machinery */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.li{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;text-align:left;background:none;border-left:3px solid transparent;border-top:0;border-right:0;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li[aria-current="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
.li-main{flex:1;min-width:0}
.li-main b{display:block}
.li-main small{display:block;color:var(--muted);font-size:.78rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink)}
.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;padding:14px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts b{font-weight:500;overflow-wrap:anywhere}
.hm{font-family:var(--f-mono);font-size:1.15rem;font-weight:500;letter-spacing:.04em}
.badge-long{background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.timeline{list-style:none;margin:0;padding:6px 14px 10px}
.timeline li{display:grid;grid-template-columns:86px 14px minmax(0,1fr);gap:10px;padding:8px 0;cursor:pointer}
.timeline li:hover .tl-body b{text-decoration:underline}
.tl-date{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right;padding-top:2px}
.tl-mark{position:relative}
.tl-mark::before{content:"";position:absolute;left:6px;top:0;bottom:-16px;width:2px;background:var(--line)}
.timeline li:last-child .tl-mark::before{bottom:auto;height:10px}
.tl-mark::after{content:"";position:absolute;left:2px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--cat);border:2px solid var(--surface)}
.tl-body b{display:block}
.tl-body small{color:var(--muted)}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chipbar button{cursor:pointer;background:var(--surface)}
.chipbar button[aria-pressed="true"]{background:var(--cat,var(--steel));color:var(--surface);border-color:var(--cat,var(--steel))}
.issue{padding:10px 14px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue b{display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.member:hover{border-color:var(--muted)}
.member-top{display:flex;gap:12px;align-items:center}
.member-top div{min-width:0}
.member-top b{display:block;font-size:1rem}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:2px 7px;border-radius:3px;background:var(--surface-2)}
.tag.exp{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-weight:600}
.tag.expd{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit);font-weight:600}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.mstats div{display:flex;flex-direction:column}
.mstats b{font-family:var(--f-display);font-size:1.3rem;font-weight:600}
.mstats span{font-size:.7rem;color:var(--muted)}
.org{display:flex;flex-direction:column;gap:6px;font-size:.85rem;padding:12px 14px}
.org div{display:flex;gap:8px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-head{background:var(--steel);color:var(--steel-ink);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.sheet-head h2{font-size:1.6rem}
.sheet-head .mono{color:var(--steel-muted)}
.sheet-head .x{margin-left:auto;background:none;border:1px solid var(--steel-muted);color:var(--steel-ink);border-radius:4px;width:34px;height:34px;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.sheet-body{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:84px;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600;color:var(--muted);padding:8px 4px 0;border-top:4px solid var(--line);text-align:center}
.step.done{border-top-color:var(--ok);color:var(--ink)}
.step.cur{border-top-color:var(--accent);color:var(--ink)}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.sect>h3{padding:10px 14px;border-bottom:1px solid var(--line);font-size:1rem;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sect .in{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:10px;align-items:center;padding:4px 0}
.task input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.task.done span{color:var(--muted);text-decoration:line-through}
.task .who{margin-left:auto}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photo{margin:0;display:flex;flex-direction:column;gap:4px}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--surface-2)}
.photo figcaption{font-size:.74rem;color:var(--muted)}
.photo .stage{font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);font-size:.66rem}
.upload{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px dashed var(--line);border-radius:5px;padding:10px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.log li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.log time{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.88rem;justify-content:end;padding:10px 14px;border-top:1px solid var(--line)}
.totals b{font-variant-numeric:tabular-nums;text-align:right}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
.form label.full{grid-column:1/-1}
.form .field,.form input,.form textarea{color:var(--ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--steel);color:var(--steel-ink);padding:10px 16px;border-radius:5px;z-index:60;font-size:.88rem;box-shadow:var(--shadow)}

/* role-based visibility */
body[data-role="mechanic"] .cost, body[data-role="mechanic"] .boss, body[data-role="supervisor"] .boss{display:none!important}

/* ---------- state ---------- */
const state = {view:'dashboard', role:'boss', me:'S3', jobQ:'', jobCat:'', jobStatus:'open', cal:new Date(2026,9,1),
  mTab:'units', unit:'U3', model:'M2', histCat:'', invQ:'', invModel:'', invLow:false};
try{ const v = localStorage.getItem('hdg-view'); if(v) state.view = v; }catch(e){}
if(location.hash && document.getElementById('v-'+location.hash.slice(1))) state.view = location.hash.slice(1);

/* ---------- derived ---------- */
const job = id => jobs.find(j => j.id === id);
const isOpen = j => j.status !== 'Closed';
const visibleJobs = () => jobs.filter(j => state.role !== 'mechanic' || j.lead === state.me || j.team.includes(state.me));
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const unitName = u => { const m = models[units[u].model]; return m.make+' '+m.model; };
const dueClass = j => !isOpen(j) || j.status==='Ready for Pickup' ? '' : (j.due < TODAY ? 'over' : (daysBetween(TODAY,j.due) <= 1 ? 'soon' : ''));
const dueText = j => { if(!isOpen(j)) return 'Closed '+fmtD(j.closed||j.due); const n = daysBetween(TODAY,j.due); if(j.status==='Ready for Pickup') return 'Ready'; return n<0 ? (-n)+'d overdue' : n===0 ? 'Due today' : n===1 ? 'Due tomorrow' : 'Due '+fmtD(j.due); };
const catChip = c => `<span class="chip" style="--cat:${CATS[c].color}"><span class="dot"></span>${esc(CATS[c].name)}</span>`;
const avatar = (s, cls='') => s ? `<span class="avatar ${cls}" title="${esc(staff[s].name)}">${initials(staff[s].name)}</span>` : '';
function staffState(s){
  const p = staff[s];
  if(p.leave) return {k:'leave',t:'On leave'};
  const active = jobs.filter(j => ['Diagnosing','In Progress','Quality Check'].includes(j.status) && (j.lead===s || j.team.includes(s)));
  if(!active.length) return {k:'idle',t:'Available'};
  const f = active.find(j => j.site==='Field');
  return f ? {k:'field',t:'In field',job:f} : {k:'on',t:'On job',job:active[0]};
}
const jobTotals = j => {
  const pSell = j.parts.reduce((a,x)=>a+parts[x.p].sell*x.q,0), pCost = j.parts.reduce((a,x)=>a+parts[x.p].cost*x.q,0);
  const hrs = j.labour.reduce((a,x)=>a+x.h,0), lCost = j.labour.reduce((a,x)=>a+x.h*staff[x.s].rate,0);
  const lSell = j.cat==='WARR' ? 0 : hrs*LABOUR_RATE;
  return {pSell,pCost,hrs,lSell,lCost,total:(j.cat==='WARR'?0:pSell)+lSell};
};

/* ---------- views ---------- */
function setView(v){
  state.view = v;
  try{ localStorage.setItem('hdg-view', v); }catch(e){}
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view===v ? 'page' : 'false'));
  document.querySelectorAll('section.view').forEach(s => s.hidden = s.id !== 'v-'+v);
  render();
}
function render(){ ({dashboard:renderDashboard,jobs:renderJobs,calendar:renderCalendar,machinery:renderMachinery,inventory:renderInventory,team:renderTeam})[state.view](); }

function jobCard(j){
  return `<button class="card" data-job="${j.id}" style="--cat:${CATS[j.cat].color}">
    <div class="card-top"><span class="mono">${j.id}</span><span class="pri ${j.pri}">${j.pri}</span></div>
    <div class="mach">${esc(unitName(j.unit))}</div>
    <div class="cust">${esc(customers[units[j.unit].cust].name)} · ${j.site==='Field'?'Field: '+esc(j.siteLoc):esc(j.siteLoc)}</div>
    ${catChip(j.cat)}
    <div class="card-foot"><span class="due ${dueClass(j)}">${dueText(j)}</span>
      <span class="avatars">${j.lead ? [j.lead,...j.team].map(s=>avatar(s)).join('') : '<span class="due over">Unassigned</span>'}</span></div>
  </button>`;
}

    Object.entries(staff).forEach(([k,s])=>s.certs.forEach(c=>{const d=daysBetween(TODAY,c.e); if(d<45) attn.push({sev:d<0?'var(--crit)':'var(--warn)',t:`${esc(s.name)}: ${esc(c.n)} ${d<0?'expired '+fmtD(c.e):'expires '+fmtD(c.e)}`,staff:k});}));
  }

  $('#v-dashboard').innerHTML = `

      ${mine?'':'<button class="btn primary" data-action="new-emg">+ Emergency call-out</button><button class="btn" data-action="new-job">+ New job</button>'}</div>
    <div class="kpis">
      <div class="kpi"><b>${open.length}</b><span>Open jobs</span></div>
      <div class="kpi ${emg?'alert':''}"><b>${emg}</b><span>Active emergencies</span></div>
      <div class="kpi ${overdue?'alert':''}"><b>${overdue}</b><span>Overdue</span></div>
      <div class="kpi"><b>${dueWeek}</b><span>Due in next 7 days</span></div>
      ${mine?'':`<div class="kpi"><b>${busy}/${onDuty}</b><span>Crew on jobs / on duty</span></div>
      <div class="kpi ${low?'warn':''}"><b>${low}</b><span>Parts below minimum</span></div>
      <div class="kpi boss"><b style="font-size:1.45rem">${RM(wip).replace('.00','')}</b><span>Work in progress value</span></div>`}
    </div>
    <div class="dash">
      <div style="min-width:0;display:flex;flex-direction:column;gap:8px">

          ${attn.map(a=>`<div class="attn" style="--sev:${a.sev}" ${a.job?`data-job="${a.job}"`:a.unit?`data-unit="${a.unit}"`:a.staff?`data-staff="${a.staff}"`:'data-goto="inventory"'}><i></i><span>${a.t}</span></div>`).join('')||'<div class="attn"><span class="muted">All clear.</span></div>'}

function renderJobs(){
  let list = visibleJobs();
  if(state.jobStatus==='open') list = list.filter(isOpen); else if(state.jobStatus) list = list.filter(j=>j.status===state.jobStatus);
  if(state.jobCat) list = list.filter(j=>j.cat===state.jobCat);
  const q = state.jobQ.toLowerCase();
  if(q) list = list.filter(j=>[j.id,unitName(j.unit),customers[units[j.unit].cust].name,j.complaint,units[j.unit].serial].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>b.opened.localeCompare(a.opened));
  $('#v-jobs').innerHTML = `
    <div class="view-head"><h2>Jobs</h2>${state.role==='mechanic'?'':'<button class="btn primary" data-action="new-job">+ New job</button>'}</div>
    <div class="filters">
      <input type="search" id="jobQ" placeholder="Search job no., machine, customer, serial" value="${esc(state.jobQ)}" style="flex:1 1 240px">
      <select class="field" id="jobCat"><option value="">All categories</option>${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${state.jobCat===k?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select class="field" id="jobStatus"><option value="open" ${state.jobStatus==='open'?'selected':''}>All open</option><option value="" ${state.jobStatus===''?'selected':''}>All incl. closed</option>${STATUSES.map(s=>`<option ${state.jobStatus===s?'selected':''}>${s}</option>`).join('')}</select>

    </table></div>`;
}

function renderCalendar(){
  const m = state.cal, y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y,mo,1), start = new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const vis = visibleJobs().filter(isOpen);
  const pms = state.role==='mechanic' ? [] : Object.entries(units).filter(([k,u])=>u.pmNext).map(([k,u])=>({unit:k,...u.pmNext}));
  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const ds = iso(d);
    const evs = vis.filter(j=>j.due===ds).map(j=>`<button class="ev ${dueClass(j)==='over'?'over':''}" style="--cat:${CATS[j.cat].color}" data-job="${j.id}" title="${j.id} ${esc(unitName(j.unit))}">${j.id.slice(-4)} ${esc(models[units[j.unit].model].model)} · ${esc(CATS[j.cat].name.split(' ')[0])}</button>`).join('')
      + pms.filter(p=>p.date===ds).map(p=>`<button class="ev pm" style="--cat:var(--c-pm)" data-unit="${p.unit}" title="PM due">PM ${esc(models[units[p.unit].model].model)} · ${esc(p.type)}</button>`).join('');
    cells += `<div class="day ${d.getMonth()!==mo?'out':''} ${ds===TODAY?'today':''}"><span class="dnum">${d.getDate()}</span>${evs}</div>`;
    if(i>=34 && d.getMonth()!==mo && d.getDay()===0) break;
  }
  const agenda = [...vis.map(j=>({d:j.due,h:`<button class="ev" style="--cat:${CATS[j.cat].color};font-size:.85rem" data-job="${j.id}">${fmtD(j.due)} · ${j.id} ${esc(unitName(j.unit))}</button>`})),...pms.map(p=>({d:p.date,h:`<button class="ev pm" style="--cat:var(--c-pm);font-size:.85rem" data-unit="${p.unit}">${fmtD(p.date)} · PM ${esc(unitName(p.unit))} ${esc(p.type)}</button>`}))]
    .filter(a=>D(a.d).getMonth()===mo && D(a.d).getFullYear()===y).sort((a,b)=>a.d.localeCompare(b.d));
  $('#v-calendar').innerHTML = `
    <div class="view-head"><h2>${m.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2>
      <button class="btn" data-action="cal-prev" aria-label="Previous month">‹</button><button class="btn" data-action="cal-today">Today</button><button class="btn" data-action="cal-next" aria-label="Next month">›</button></div>
    <p class="muted" style="margin:0">Jobs appear on their target due date. Dashed entries are preventive maintenance forecast from each machine's hour meter. Red outline means overdue.</p>
    <div class="legend">${Object.values(CATS).map(c=>`<span style="--cat:${c.color}"><i></i>${esc(c.name)}</span>`).join('')}</div>
    <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    <div class="agenda panel"><div class="panel-head"><h3>This month</h3></div><div class="in" style="padding:10px 14px;display:flex;flex-direction:column;gap:6px">${agenda.map(a=>a.h).join('')||'<span class="muted">Nothing scheduled.</span>'}</div></div>`;
}

}

function partsTable(mk){

}
function unitDetail(k){
  const u = units[k], m = models[u.model];
  const hist = jobs.filter(j=>j.unit===k).sort((a,b)=>b.opened.localeCompare(a.opened));
  const shown = state.histCat ? hist.filter(j=>j.cat===state.histCat) : hist;

  return `

      ${stay>30?`<span class="badge-long">In yard ${stay} days</span>`:''}</div>

function renderInventory(){

  if(state.invModel) list = list.filter(([k,p])=>p.fits.includes(state.invModel)||p.fits.includes('ALL'));
  if(state.invLow) list = list.filter(([k,p])=>p.qty<p.min);
  const q = state.invQ.toLowerCase(); if(q) list = list.filter(([k,p])=>(p.no+' '+p.desc+' '+p.cat).toLowerCase().includes(q));
  const value = Object.values(parts).reduce((a,p)=>a+p.cost*p.qty,0);
  $('#v-inventory').innerHTML = `
    <div class="view-head"><h2>Parts &amp; Inventory</h2><span class="muted cost">Stock value at cost: <b class="num">${RM(value)}</b></span>${state.role==='mechanic'?'':'<button class="btn" data-action="po">Create purchase order</button>'}</div>
    <div class="filters">
      <input type="search" id="invQ" placeholder="Search part no. or description" value="${esc(state.invQ)}" style="flex:1 1 220px">
      <select class="field" id="invModel"><option value="">Fits any model</option>${Object.entries(models).map(([k,m])=>`<option value="${k}" ${state.invModel===k?'selected':''}>${esc(m.make)} ${esc(m.model)}</option>`).join('')}</select>
      <label><input type="checkbox" id="invLow" ${state.invLow?'checked':''}> Below minimum only</label>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Part no.</th><th>Description</th><th>Fits</th><th>Supplier</th><th class="r cost">Purchase</th><th class="r">Selling</th><th class="r cost">Margin</th><th class="r">On hand</th><th class="r">Min</th><th>Bin</th></tr></thead>
      <tbody>${list.map(([k,p])=>`<tr><td class="mono">${esc(p.no)}</td><td>${esc(p.desc)}<br><small class="muted">${esc(p.cat)}</small></td><td>${p.fits.includes('ALL')?'<span class="muted">All</span>':p.fits.map(f=>esc(models[f].model)).join(', ')}</td><td>${esc(suppliers[p.sup].name)}</td><td class="r num cost">${RM(p.cost)}</td><td class="r num">${RM(p.sell)}</td><td class="r num cost">${Math.round((p.sell-p.cost)/p.sell*100)}%</td><td class="r num ${p.qty===0?'stock-out':p.qty<p.min?'stock-low':''}">${p.qty} ${p.uom}${p.onOrder?`<br><small class="muted">+${p.onOrder} on order</small>`:''}</td><td class="r num">${p.min}</td><td class="mono">${p.bin}</td></tr>`).join('')||'<tr><td colspan="10" class="muted">No parts match.</td></tr>'}</tbody>
    </table></div>
    <div class="cost" style="display:flex;flex-direction:column;gap:8px"><h3>Suppliers</h3><div class="tbl-wrap"><table><thead><tr><th>Supplier</th><th>Location</th><th>Phone</th><th>Terms</th><th>Lead time</th><th class="r">Parts</th></tr></thead><tbody>

}

/* ---------- sheets ---------- */

}

const nowStamp = () => TODAY+' '+new Date().toTimeString().slice(0,5);
const who = () => state.role==='boss'?staff.S0.name:state.role==='supervisor'?staff.S1.name:staff.S3.name;
function toast(t){ $('#toastRoot').innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast.h); toast.h=setTimeout(()=>$('#toastRoot').innerHTML='',2200); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action],[data-job],[data-unit],[data-staff],[data-goto],[data-view],[data-mtab],[data-pick-unit],[data-pick-model],[data-hist]');
  if(!a) return;
  if(a.matches('input,select,label.task')) return;
  const d = a.dataset;
  if(d.action){
    if(d.action==='close') closeSheet();
    if(d.action==='new-job') openNewJob(false);
    if(d.action==='new-emg') openNewJob(true);
    if(d.action==='cal-prev'){ state.cal=new Date(state.cal.getFullYear(),state.cal.getMonth()-1,1); render(); }
    if(d.action==='cal-next'){ state.cal=new Date(state.cal.getFullYear(),state.cal.getMonth()+1,1); render(); }
    if(d.action==='cal-today'){ state.cal=new Date(2026,9,1); render(); }
    if(d.action==='po') toast('Purchase orders are part of phase 2. Low-stock parts would be pre-filled here.');
    return;
  }
  if(d.job){ e.preventDefault(); openJob(d.job); return; }
  if(d.unit){ closeSheet(); state.mTab='units'; state.unit=d.unit; state.histCat=''; setView('machinery'); return; }
  if(d.staff){ openStaff(d.staff); return; }
  if(d.goto){ setView(d.goto); return; }
  if(d.view){ setView(d.view); return; }
  if(d.mtab){ state.mTab=d.mtab; render(); return; }
  if(d.pickUnit){ state.unit=d.pickUnit; state.histCat=''; if(d.mtabGo) state.mTab=d.mtabGo; render(); return; }
  if(d.pickModel){ state.model=d.pickModel; if(d.mtabGo) state.mTab=d.mtabGo; render(); return; }
  if(d.hist!==undefined){ state.histCat=d.hist; render(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='roleSel'){ state.role=t.value; document.body.dataset.role=t.value; closeSheet(); render(); return; }
  if(t.id==='jobCat'){ state.jobCat=t.value; render(); }
  if(t.id==='jobStatus'){ state.jobStatus=t.value; render(); }
  if(t.id==='invModel'){ state.invModel=t.value; render(); }
  if(t.id==='invLow'){ state.invLow=t.checked; render(); }
  if(t.id==='jStatus'){ const j=job(t.dataset.jid); j.log.unshift({d:nowStamp(),t:`Status ${j.status} → ${t.value} by ${who()}.`}); j.status=t.value; if(t.value==='Closed') j.closed=TODAY; render(); openJob(j.id); toast('Status updated'); }
  if(t.id==='jLead'){ const j=job(t.dataset.jid); j.lead=t.value||null; j.team=j.team.filter(s=>s!==j.lead); j.log.unshift({d:nowStamp(),t:t.value?`Assigned to ${staff[t.value].name} by ${who()}.`:'Unassigned.'}); if(t.value && j.status==='Received') {} render(); openJob(j.id); toast('Lead updated'); }
  if(t.dataset.task!==undefined){ const j=job(t.dataset.jid); j.tasks[+t.dataset.task].done=t.checked; render(); openJob(j.id); }
  if(t.id==='photoIn'){
    const j=job(t.dataset.jid), stage=$('#photoStage').value, cap=$('#photoCap').value.trim();
    const files=[...t.files]; let n=0;
    files.forEach(f=>{ const r=new FileReader(); r.onload=()=>{ j.photos.push({src:r.result,stage,cap}); if(++n===files.length){ j.log.unshift({d:nowStamp(),t:`${files.length} ${stage.toLowerCase()} photo(s) added by ${who()}.`}); openJob(j.id); toast('Photos added'); } }; r.readAsDataURL(f); });
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='jobQ'||t.id==='invQ'){ state[t.id]=t.value; const pos=t.selectionStart; render(); const n=document.getElementById(t.id); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener('submit', e => {
  const f = e.target; if(!f.dataset.form) return; e.preventDefault();
  if(f.dataset.form==='newjob'){
    const c=$('#nj-c').value.trim(); if(!c){ toast('Add the customer complaint to create the job'); return; }
    const unit=$('#nj-unit').value, id=nextId(), lead=$('#nj-lead').value||null;
    jobs.unshift({id,cat:$('#nj-cat').value,pri:$('#nj-pri').value,status:lead?'Diagnosing':'Received',unit,site:$('#nj-site').value,siteLoc:$('#nj-loc').value||'—',opened:TODAY,due:$('#nj-due').value||TODAY,lead,team:[],hmIn:+$('#nj-hm').value||units[unit].hm,complaint:c,diagnosis:'',tasks:[],parts:[],labour:[],photos:[],log:[{d:nowStamp(),t:`Job created by ${who()}.`}]});
    closeSheet(); render(); openJob(id); toast(id+' created'); return;
  }
  const j = job(f.dataset.jid);
  if(f.dataset.form==='task'){ const v=$('#newTask').value.trim(); if(!v) return; j.tasks.push({t:v,done:false}); }
  if(f.dataset.form==='note'){ const v=$('#newNote').value.trim(); if(!v) return; j.log.unshift({d:nowStamp(),t:v+' — '+who()}); }
  if(f.dataset.form==='labour'){ const h=+$('#labH').value; if(!h) return; const s=$('#labS').value; j.labour.push({s,d:TODAY,h}); if(s!==j.lead && !j.team.includes(s)) j.team.push(s); j.log.unshift({d:nowStamp(),t:`${h} h logged for ${staff[s].name}.`}); }
  render(); openJob(j.id);
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

document.body.dataset.role = state.role;
setView(state.view);
</script>
