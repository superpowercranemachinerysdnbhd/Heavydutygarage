# Production: app + PostgreSQL + Caddy (automatic HTTPS) + nightly backups.
# Run from this folder:  docker compose up -d --build
name: heavyworks

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heavyworks
      POSTGRES_DB: heavyworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heavyworks -d heavyworks"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ../web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://heavyworks:${POSTGRES_PASSWORD}@db:5432/heavyworks
      LABOUR_RATE: ${LABOUR_RATE:-95}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: heavyworks
      PGDATABASE: heavyworks
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: MYT-8   # Malaysia time (UTC+8), no tzdata needed
    volumes:
      - ./backup.sh:/backup.sh:ro
      - appdata:/data:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
